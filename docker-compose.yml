services:
  postgres:
    image: postgres:16-alpine
    container_name: brewlite_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: brewlite
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d brewlite']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: brewlite_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/brewlite?schema=public
      JWT_SECRET: brewlite-super-secret-jwt-key-change-in-prod
      PORT: 3001
      ZALOPAY_APP_ID: '2554'
      ZALOPAY_KEY1: 'sdngKKJmqEMzvh5QQcdD2A9XBSKUNaYn'
      ZALOPAY_KEY2: 'trMrHtvjo6myautxDUiAcYsVtaeQ8nhf'
      ZALOPAY_CREATE_ENDPOINT: 'https://sb-openapi.zalopay.vn/v2/create'
      ZALOPAY_QUERY_ENDPOINT: 'https://sb-openapi.zalopay.vn/v2/query'
      ZALOPAY_CALLBACK_URL: 'http://localhost:3001/payments/zalopay/callback'
    ports:
      - '3001:3001'

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    container_name: brewlite_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - '3000:3000'

volumes:
  postgres_data:
